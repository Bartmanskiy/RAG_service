services:
  api:
    build: .
    container_name: corporate_rag_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongodb
      - ollama

  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    container_name: corporate_rag_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  ollama:
    image: ollama/ollama:latest
    container_name: corporate_rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    container_name: corporate_rag_ollama_init
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull llama3.2:3b
        ollama pull nomic-embed-text

volumes:
  mongodb_data:
  ollama_data: